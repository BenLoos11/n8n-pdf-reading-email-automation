
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - TZ=America/Chicago
      - GENERIC_TIMEZONE=America/Chicago
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_RUNNERS_ENABLED=true
      - N8N_RESTRICT_FILE_ACCESS_TO=/books
    volumes:
      - n8n_data:/home/node/.n8n
      - type: bind
        source: ${BOOKS_PATH}
        target: /books
        read_only: True
  pdf-reader:
    build:
      context: .
      dockerfile: Dockerfile 
    restart: unless-stopped 
    volumes:
      - type: bind 
        source: ${BOOKS_PATH}
        target: /books 
        read_only: true 


volumes:
  n8n_data:
